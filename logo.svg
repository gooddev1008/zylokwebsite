<svg xmlns="http://www.w3.org/2000/svg" viewBox="195 78 300 72" height="44">
  <defs>
    <linearGradient id="logoGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e2c97e"/>
      <stop offset="100%" stop-color="#c9a84c"/>
    </linearGradient>
    <linearGradient id="logoGold2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#e2c97e"/>
      <stop offset="100%" stop-color="#c9a84c"/>
    </linearGradient>
  </defs>

  <!-- Icon box -->
  <rect x="200" y="85" width="64" height="64" rx="4" fill="url(#logoGold)"/>

  <!-- Z top bar -->
  <line x1="214" y1="101" x2="250" y2="101" stroke="#0f0d09" stroke-width="4.5" stroke-linecap="round"/>
  <!-- Z bottom bar -->
  <line x1="214" y1="137" x2="250" y2="137" stroke="#0f0d09" stroke-width="4.5" stroke-linecap="round"/>
  <!-- Z diagonal blade 1 -->
  <line x1="248" y1="103" x2="232" y2="119" stroke="#0f0d09" stroke-width="4" stroke-linecap="round"/>
  <!-- Z diagonal blade 2 -->
  <line x1="216" y1="135" x2="232" y2="119" stroke="#0f0d09" stroke-width="4" stroke-linecap="round"/>
  <!-- Blade extensions -->
  <line x1="232" y1="119" x2="252" y2="107" stroke="#0f0d09" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="232" y1="119" x2="212" y2="131" stroke="#0f0d09" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Pivot -->
  <circle cx="232" cy="119" r="3.5" fill="#0f0d09"/>
  <circle cx="232" cy="119" r="1.8" fill="#e2c97e"/>
  <!-- Handle rings -->
  <circle cx="250" cy="101" r="4.5" fill="none" stroke="#0f0d09" stroke-width="2"/>
  <circle cx="214" cy="137" r="4.5" fill="none" stroke="#0f0d09" stroke-width="2"/>

  <!-- ZYLOK wordmark -->
  <text x="282" y="112" font-family="Georgia, serif" font-size="42" letter-spacing="8" fill="url(#logoGold2)">ZYLOK</text>
  <!-- Subtitle -->
  <text x="282" y="138" font-family="Georgia, serif" font-size="12" letter-spacing="4" fill="#c9a84c" opacity="0.65">SALON MANAGEMENT</text>
</svg>